<!DOCTYPE html>
<html>
	<head>
		<title>Goredacted Options</title>
		<link rel="stylesheet" href="options.css" />
	</head>
	<body>
		<div class="container">
			<h1>Goredacted Options</h1>

			<!-- General Options Section -->
			<section class="section">
				<h2>General Options</h2>
				<div class="input-group">
					<label for="http-endpoint">HTTP Endpoint:</label>
					<input
						type="text"
						id="http-endpoint"
						placeholder="http://127.0.0.1:5678/parse"
					/>
				</div>
				<button id="save-general">Save General Options</button>
			</section>

			<!-- Enabled Domains Section -->
			<section class="section">
				<h2>Enabled Domains</h2>
				<div class="input-group">
					<input
						type="text"
						id="new-enabled-domain"
						placeholder="example.com"
					/>
					<button id="add-enabled">Add</button>
				</div>
				<ul id="enabled-domain-list"></ul>
			</section>

			<!-- Disabled Domains Section -->
			<section class="section">
				<h2>Disabled Domains</h2>
				<div class="input-group">
					<input
						type="text"
						id="new-disabled-domain"
						placeholder="example.com"
					/>
					<button id="add-disabled">Add</button>
				</div>
				<ul id="disabled-domain-list"></ul>
			</section>
		</div>

		<script src="options.js"></script>
	</body>
</html>
